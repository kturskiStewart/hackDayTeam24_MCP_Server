[project]
name = "sailpoint-mcp-server"
version = "0.1.0"
description = "MCP server for SailPoint Identity Security Cloud, built on the SailPoint Python SDK"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "mcp>=2.0.0",
    "sailpoint>=2.1.0",
    "python-dotenv>=1.0.0",
    "truststore>=0.9.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

[project.scripts]
sailpoint-mcp = "sailpoint_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sailpoint_mcp"]
